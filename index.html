<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f8b4c">

    <title>Depann'Home Pro</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        <img src="assets/logo.png" alt="Depann'Home Pro">
    </div>

    <div class="title">
        <h1>Depann'Home Pro</h1>
        <p>Assistant Technique</p>
    </div>

</header>


<section class="search">

    <input
        type="text"
        id="searchInput"
        placeholder="Rechercher un moteur, une télécommande ou une procédure..."
    >

</section>


<main id="home">

    <div class="card brand" data-brand="somfy">
        <h2>SOMFY</h2>
        <p>Volets • Stores • Portails</p>
    </div>

    <div class="card brand" data-brand="faac">
        <h2>FAAC</h2>
        <p>Portails • Automatismes</p>
    </div>

    <div class="card brand" data-brand="bubendorff">
        <h2>BUBENDORFF</h2>
        <p>Volets roulants</p>
    </div>

    <div class="card brand" data-brand="nice">
        <h2>NICE</h2>
        <p>Volets • Portails</p>
    </div>

    <div class="card brand" data-brand="came">
        <h2>CAME</h2>
        <p>Portails • Automatismes</p>
    </div>

</main>


<section id="content" class="hidden">

</section>


<footer>

    Depann'Home Pro - Version 0.1

</footer>


<script src="app.js"></script>

</body>
</html>
