<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Depann'Home Pro</title>

    <meta name="theme-color" content="#0A5C36">

    <meta name="description"
        content="Assistant professionnel de dépannage Somfy, FAAC, Nice, Bubendorff, CAME.">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="assets/logo.png.png" type="image/png">

    <link rel="stylesheet" href="css/style.css?v=247">
    <link rel="stylesheet" href="css/partner-dialogue.css?v=6">
    <link rel="stylesheet" href="css/report-editor.css?v=7">
    <link rel="stylesheet" href="css/health-dashboard.css?v=1">

</head>

<body class="auth-pending">

    <div id="authRoot">

    <header class="topbar">

        <div class="header-content">

            <img
                src="assets/logo.png.png"
                alt="Depann'Home"
                class="logo">

            <div>

                <h1>Depann'Home Pro</h1>

                <p>Assistant de dépannage professionnel</p>

            </div>

            <div class="user-session" id="userSession" hidden>
                <span class="active-work-context">
                    <span class="pc-workstation-name"><span id="workstationLabel">Poste</span> · <strong id="userEmail"></strong></span>
                    <span id="mobileUserSections" class="mobile-user-sections" hidden></span>
                    <span id="activeCompanyBadge" class="active-company-badge" hidden>Entreprise active · <strong id="activeCompanyName"></strong></span>
                </span>
                <label id="groupCompanySelector" class="group-company-selector" hidden>Entreprise <select aria-label="Entreprise active"></select></label>
                <span class="collaboration-sync" data-collaboration-sync="syncing" title="Connexion en temps réel" aria-label="Connexion en temps réel">●</span>
                <button type="button" id="notificationsBtn" class="refresh-button" aria-label="Notifications">Notifications</button>
                <button type="button" id="refreshBtn" class="refresh-button" title="Actualiser les données partagées" aria-label="Actualiser les données partagées">Actualiser</button>
                <button type="button" id="logoutBtn" class="logout-button">Déconnexion</button>
            </div>

        </div>

    </header>

    <nav id="breadcrumb">
           Accueil
    </nav>

    <main id="app">

        <section class="search-section">

            <input
                id="search"
                type="search"
                placeholder="Rechercher un module, un client ou une intervention...">

        </section>

        <section class="quick-actions">

              <button id="clientsBtn">
                  Clients <b class="message-alert" data-client-message-alert hidden aria-label="Nouvelles notes client"></b>
            </button>

              <button id="calendarBtn">
                  Planning <b class="message-alert" data-calendar-alert hidden aria-label="Nouveaux rendez-vous aujourd’hui"></b>
              </button>

              <button id="libraryBtn">
                  Bibliothèque
              </button>

              <button id="billingBtn">
                  Devis, factures &amp; rapports de fuite
              </button>

              <button id="accountingBtn">
                  Comptabilité · facturation électronique &amp; PDP
              </button>

              <button id="purchasesBtn">
                  Achats
              </button>

              <button id="partnerMissionsBtn">
                  Missions partenaires <b class="message-alert" data-partner-notification-alert hidden aria-label="Nouvelles notifications partenaires"></b>
              </button>

              <button id="companyEmailBtn">
                  Espace e-mail
              </button>

              <button id="settingsBtn">
                  Paramètres
              </button>

        </section>

        <section>

            <h2 class="section-title" id="pageTitle">

                Gammes

            </h2>

        </section>

        <section id="brands">

        </section>

    </main>

    <footer>

        <button class="nav-button active" data-nav="home">
            <span>Accueil</span>
        </button>

        <button class="nav-button" data-nav="search">
            <span>Recherche</span>
        </button>

        <button class="nav-button" data-nav="store">
            <span>Magasin</span>
        </button>

        <button class="nav-button" data-nav="clients">
            <span class="nav-label-clients">Clients</span><span class="nav-label-messages">Messages</span><b class="message-alert" data-client-message-alert hidden aria-label="Nouvelles notes client"></b>
        </button>

        <button class="nav-button" data-nav="billing">
            <span>Devis &amp; rapports</span>
        </button>

        <button class="nav-button" data-nav="accounting">
            <span>Comptabilité</span>
        </button>

        <button class="nav-button" data-nav="purchases">
            <span>Achats</span>
        </button>

        <button class="nav-button" data-nav="partner-missions">
            <span>Missions</span><b class="message-alert" data-partner-notification-alert hidden aria-label="Nouvelles notifications partenaires"></b>
        </button>

        <button class="nav-button" data-nav="company-email">
            <span>E-mail</span>
        </button>

        <button class="nav-button" data-nav="calendar">
            <span>Planning</span><b class="message-alert" data-calendar-alert hidden aria-label="Nouveaux rendez-vous aujourd’hui"></b>
        </button>

        <button class="nav-button" data-nav="library">
            <span>Bibliothèque</span>
        </button>

        <button class="nav-button" data-nav="settings">
            <span>Paramètres</span>
        </button>

    </footer>

    </div>

    <script type="module" src="js/app.js?v=399"></script>

</body>

</html>
