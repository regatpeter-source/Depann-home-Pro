name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depannhome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d depannhome_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/depannhome_test
      SESSION_SECRET: ci-only-random-session-secret-0123456789abcdef
      CREATOR_USERNAMES: ci-creator
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate health dashboard syntax
        run: npm run health-check
      - name: Run project checks and tests
        run: npm run check
